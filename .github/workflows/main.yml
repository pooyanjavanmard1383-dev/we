name: Build Nava APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android scaffold
        run: flutter create --org com.pooyan --project-name nava --platforms=android .
      - name: Copy app sources
        run: |
          rm -rf lib test
          mkdir -p lib
          cp nava_src/lib/*.dart lib/
          cp nava_src/pubspec.yaml pubspec.yaml
      - name: Patch Android files
        run: python3 tools/patch_android.py
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: Nava-apk
          path: build/app/outputs/flutter-apk/app-release.apk
